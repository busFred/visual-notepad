[package]
name = "vn-core"
version = "0.0.2"
edition = "2024"
publish = false

[lib]
name = "vn_core"
# staticlib is linked into the Qt app; rlib keeps `cargo test` working.
crate-type = ["staticlib", "rlib"]

[dependencies]
comrak = { version = "0.59.0", default-features = false }
cxx = "1.0.205"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = "0.47"

[profile.release]
lto = true
codegen-units = 1
