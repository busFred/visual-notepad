name: build

on:
  push:
    branches: [main, ci]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KF6_VERSION: v6.31.0
  # Commits the v6.31.0 tags peel to on invent.kde.org (git ls-remote ... refs/tags/v6.31.0^{}).
  KF6_ECM_COMMIT: 2958379fb49c71129f119ec17f88df0b5ea21550
  KF6_KSH_COMMIT: 6d8ab7945958e7354295db7f399cce06f7de7571

jobs:
  linux:
    name: deb (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    defaults:
      run:
        shell: bash -el {0}
    env:
      KF6_PREFIX: ${{ github.workspace }}/kf6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: System packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev fonts-dejavu-core libgl1 libegl1

      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          environment-file: ci/environment-linux.yml
          environment-name: visnotepad
          # The env itself is rebuilt from the cached package downloads: the license
          # texts come from the extracted packages, which an env cache does not restore.
          cache-environment: false
          cache-downloads: true
          cache-downloads-key: pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/environment-*.yml') }}
          init-shell: bash

      - name: Cache KDE frameworks
        id: kf6
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: kf6
          key: kf6-${{ env.KF6_VERSION }}-linux-${{ matrix.arch }}-${{ hashFiles('ci/environment-linux.yml') }}

      - name: Build ECM and KSyntaxHighlighting
        if: steps.kf6.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          for repo in extra-cmake-modules syntax-highlighting; do
            git clone --depth 1 -b "$KF6_VERSION" "https://invent.kde.org/frameworks/$repo.git" "$RUNNER_TEMP/$repo"
          done
          # Fail if the tag no longer points at the audited commits.
          test "$(git -C "$RUNNER_TEMP/extra-cmake-modules" rev-parse HEAD)" = "$KF6_ECM_COMMIT"
          test "$(git -C "$RUNNER_TEMP/syntax-highlighting" rev-parse HEAD)" = "$KF6_KSH_COMMIT"
          cmake -S "$RUNNER_TEMP/extra-cmake-modules" -B "$RUNNER_TEMP/build-ecm" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$KF6_PREFIX" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/build-ecm"
          cmake --install "$RUNNER_TEMP/build-ecm"
          cmake -S "$RUNNER_TEMP/syntax-highlighting" -B "$RUNNER_TEMP/build-ksh" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$KF6_PREFIX" \
            -DCMAKE_INSTALL_PREFIX="$KF6_PREFIX" -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/build-ksh"
          cmake --install "$RUNNER_TEMP/build-ksh"
          mkdir -p "$KF6_PREFIX/ksh-src"
          cp -r "$RUNNER_TEMP/syntax-highlighting/LICENSES" "$KF6_PREFIX/ksh-src/"

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Configure and build
        run: |
          export CMAKE_PREFIX_PATH="$KF6_PREFIX:$CONDA_PREFIX"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          FONTCONFIG_FILE: /etc/fonts/fonts.conf
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Package
        run: |
          export CMAKE_PREFIX_PATH="$KF6_PREFIX:$CONDA_PREFIX"
          VN_NO_DEV_ENV=1 VN_ENV_PREFIX="$CONDA_PREFIX" VN_KF6_PREFIX="$KF6_PREFIX" \
            VN_KSH_SRC="$KF6_PREFIX/ksh-src" VN_BUILD_DIR="$PWD/build" VN_BUILD_TESTING=ON \
            scripts/package-deb.sh
          ls -l dist

      - name: Check the package
        shell: bash
        run: |
          set -eu
          deb=$(ls dist/visnotepad_*_${{ matrix.arch }}.deb)
          dpkg-deb -I "$deb"
          dir=$(mktemp -d)
          dpkg-deb -x "$deb" "$dir"
          fail=0
          for f in "$dir/opt/visnotepad/bin/visnotepad" $(find "$dir/opt/visnotepad/plugins" -name '*.so'); do
            if ldd "$f" | grep 'not found'; then echo "unresolved libraries in $f"; fail=1; fi
          done
          test -d "$dir/opt/visnotepad/licenses/conda" || { echo "no conda licenses"; fail=1; }
          test -f "$dir/opt/visnotepad/share/visnotepad/microtex/res/fonts/fonts.json" || ls "$dir/opt/visnotepad/share/visnotepad/microtex/res"
          exit $fail

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-${{ matrix.arch }}
          path: dist/visnotepad_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  windows:
    name: windows-x64
    runs-on: windows-2022
    env:
      KF6_PREFIX: ${{ github.workspace }}\kf6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          environment-file: ci/environment-windows.yml
          environment-name: visnotepad
          # The env itself is rebuilt from the cached package downloads: the license
          # texts come from the extracted packages, which an env cache does not restore.
          cache-environment: false
          cache-downloads: true
          cache-downloads-key: pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/environment-*.yml') }}
          init-shell: none

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Environment paths
        shell: pwsh
        run: |
          $prefix = Join-Path $env:MAMBA_ROOT_PREFIX 'envs\visnotepad'
          if (-not (Test-Path $prefix)) { throw "conda env not found at $prefix" }
          "ENV_PREFIX=$prefix" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=$env:KF6_PREFIX;$prefix\Library" >> $env:GITHUB_ENV
          "$env:KF6_PREFIX\bin" >> $env:GITHUB_PATH
          # Tools from the env (cmake, ninja, rust) come after the MSVC tools.
          foreach ($d in "$prefix\Library\bin", "$prefix\Scripts", "$prefix\bin", $prefix) { if (Test-Path $d) { $d >> $env:GITHUB_PATH } }
          # Git's usr\bin\link.exe shadows the MSVC linker on PATH.
          $link = (Get-ChildItem "$env:VCToolsInstallDir\bin\Hostx64\x64\link.exe").FullName
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" >> $env:GITHUB_ENV
          "CMAKE_LINKER=$link" >> $env:GITHUB_ENV
          $v = (Select-String -Path CMakeLists.txt -Pattern '^project\(visnotepad VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VN_VERSION=$v" >> $env:GITHUB_ENV

      - name: Tool versions
        shell: pwsh
        run: |
          Get-Command cl, link, cmake, ninja, cargo, rustc, iscc -ErrorAction Continue | Format-Table Name, Source
          rustc -vV
          cmake --version

      - name: Cache KDE frameworks
        id: kf6
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: kf6
          key: kf6-${{ env.KF6_VERSION }}-windows-${{ hashFiles('ci/environment-windows.yml') }}

      - name: Build ECM and KSyntaxHighlighting
        if: steps.kf6.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          T=$(cygpath -m "$RUNNER_TEMP")
          KF6_PREFIX=$(cygpath -m "$KF6_PREFIX")
          for repo in extra-cmake-modules syntax-highlighting; do
            git clone --depth 1 -b "$KF6_VERSION" "https://invent.kde.org/frameworks/$repo.git" "$T/$repo"
          done
          # Fail if the tag no longer points at the audited commits.
          test "$(git -C "$T/extra-cmake-modules" rev-parse HEAD)" = "$KF6_ECM_COMMIT"
          test "$(git -C "$T/syntax-highlighting" rev-parse HEAD)" = "$KF6_KSH_COMMIT"
          common=(-G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
            "-DCMAKE_IGNORE_PREFIX_PATH=C:/Strawberry/c;C:/Strawberry/perl"
            -DCMAKE_INSTALL_PREFIX="$KF6_PREFIX" -DBUILD_TESTING=OFF)
          cmake -S "$T/extra-cmake-modules" -B "$T/build-ecm" "${common[@]}"
          cmake --build "$T/build-ecm"
          cmake --install "$T/build-ecm"
          cmake -S "$T/syntax-highlighting" -B "$T/build-ksh" "${common[@]}" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$T/build-ksh"
          cmake --install "$T/build-ksh"
          mkdir -p "$KF6_PREFIX/ksh-src"
          cp -r "$T/syntax-highlighting/LICENSES" "$KF6_PREFIX/ksh-src/"

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-${{ hashFiles('core/Cargo.lock') }}

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            "-DCMAKE_IGNORE_PREFIX_PATH=C:/Strawberry/c;C:/Strawberry/perl"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # The offscreen plugin has no font database of its own on Windows.
          QT_QPA_FONTDIR: C:\Windows\Fonts
        run: ctest --test-dir build --output-on-failure

      - name: Deploy
        shell: pwsh
        run: |
          python scripts/deploy_windows.py --build-dir build --env $env:ENV_PREFIX `
            --kf6 $env:KF6_PREFIX --ksh-src "$env:KF6_PREFIX\ksh-src" --out "dist\visnotepad"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\visnotepad | Format-Table Name, Length

      - name: Smoke test (only System32 on PATH)
        shell: cmd
        run: |
          set "PATH=C:\Windows\System32"
          set "QT_QPA_PLATFORM=offscreen"
          start "" /wait "%GITHUB_WORKSPACE%\dist\visnotepad\visnotepad.exe" --version
          echo exit code %ERRORLEVEL%
          if not "%ERRORLEVEL%"=="0" exit /b 1

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\out | Out-Null
          Compress-Archive -Path dist\visnotepad -DestinationPath "dist\out\visnotepad-$env:VN_VERSION-windows-x64-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              choco install innosetup --version 6.7.1 -y --no-progress
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc "/DAppVersion=$env:VN_VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\visnotepad" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist\out" packaging\windows\visnotepad.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist\out | Format-Table Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-portable
          path: dist/out/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-setup
          path: dist/out/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
